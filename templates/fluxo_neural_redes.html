<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06111c">
  <title>Sentinel | Fluxo Neural de Redes</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='fluxo_neural_de_redes/styles.css', v='20261014-2') }}">
</head>
<body class="intro-active">
  <canvas id="network" aria-label="Fluxo neural das regionais do Sentinel"></canvas>
  <img id="galaxyBackground" src="{{ url_for('static', filename='fluxo_neural_de_redes/sentinel-galaxy-bg.png') }}" alt="" hidden>
  <img id="galaxyNodeTexture" src="{{ url_for('static', filename='fluxo_neural_de_redes/sentinel-galaxy-node.png', v='20261014-1') }}" alt="" hidden>
  <div id="celestialTextures" hidden>
    <img data-celestial="ANDROMEDA" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-andromeda.png', v='20261014-1') }}" alt="">
    <img data-celestial="MARTE" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-marte.png', v='20261014-1') }}" alt="">
    <img data-celestial="SATURNO" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-saturno.png', v='20261014-1') }}" alt="">
    <img data-celestial="JUPITER" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-jupiter.png', v='20261014-1') }}" alt="">
    <img data-celestial="VENUS" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-venus.png', v='20261014-1') }}" alt="">
    <img data-celestial="NETUNO" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-netuno.png', v='20261014-1') }}" alt="">
    <img data-celestial="ESTRELA" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-estrela.png', v='20261014-1') }}" alt="">
    <img data-celestial="ASTEROIDE_ROCHOSO" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-asteroide-rochoso.png', v='20261014-1') }}" alt="">
    <img data-celestial="ASTEROIDE_METALICO" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-asteroide-metalico.png', v='20261014-1') }}" alt="">
    <img data-celestial="ASTEROIDE_BASALTICO" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-asteroide-basaltico.png', v='20261014-1') }}" alt="">
    <img data-celestial="ASTEROIDE_SILICATADO" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-asteroide-silicatado.png', v='20261014-1') }}" alt="">
    <img data-celestial="SATELITE_PAINEIS" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-satelite-paineis.png', v='20261014-1') }}" alt="">
    <img data-celestial="SATELITE_PARABOLICA" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-satelite-parabolica.png', v='20261014-1') }}" alt="">
    <img data-celestial="SATELITE_RETRANSMISSAO" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-satelite-retransmissao.png', v='20261014-1') }}" alt="">
    <img data-celestial="NEBULOSA_ORION" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-nebulosa-orion.png', v='20261014-1') }}" alt="">
    <img data-celestial="NEBULOSA_HELICE" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-nebulosa-helice.png', v='20261014-1') }}" alt="">
    <img data-celestial="NEBULOSA_CARANGUEJO" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-nebulosa-caranguejo.png', v='20261014-1') }}" alt="">
    <img data-celestial="NEBULOSA_CABECA_CAVALO" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-nebulosa-cabeca-cavalo.png', v='20261014-1') }}" alt="">
    <img data-celestial="NEBULOSA_BORBOLETA" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-nebulosa-borboleta.png', v='20261014-1') }}" alt="">
    <img data-celestial="NEBULOSA_OLHO_GATO" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-nebulosa-olho-gato.png', v='20261014-1') }}" alt="">
    <img data-celestial="NEBULOSA_AGUIA" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-nebulosa-aguia.png', v='20261014-1') }}" alt="">
    <img data-celestial="NEBULOSA_ANEL" src="{{ url_for('static', filename='fluxo_neural_de_redes/celestial-nebulosa-anel.png', v='20261014-1') }}" alt="">
  </div>
  <img id="introLogo" src="{{ url_for('static', filename='branding/sentinel_x_men_head.png') }}" alt="" hidden>

  <header class="topbar surface interface">
    <div class="brand">
      <img src="{{ url_for('static', filename='branding/sentinel_x_men_head.png') }}" alt="Sentinel">
      <div>
        <strong>SENTINEL <span>| FLUXO NEURAL DE REDES</span></strong>
        <small id="syncLabel">SINCRONIZANDO TOPOLOGIA</small>
      </div>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="searchInput" type="search" placeholder="Buscar regional ou dispositivo" autocomplete="off">
    </label>
    <button id="reorganizeButton" class="icon-command" type="button" title="Reorganizar a malha">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.3L3 16M3 21v-5h5"></path></svg>
      <span>Reorganizar</span>
    </button>
    <button id="tableButton" class="icon-command" type="button" title="Alternar tabela">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M9 4v16"></path></svg>
      <span>Tabela</span>
    </button>
  </header>

  <aside class="sidebar surface interface">
    <div class="metrics" id="metrics"></div>
    <label class="field-label" for="regionalFilter">Regional</label>
    <select id="regionalFilter"><option value="">Todas as regionais</option></select>
    <label class="field-label" for="typeFilter">Tipo de conexão</label>
    <select id="typeFilter"><option value="">Todos os tipos</option></select>
    <section>
      <h2>Mais conectadas</h2>
      <div id="connectionRank" class="ranking"></div>
    </section>
    <section>
      <h2>Tipos de conexão</h2>
      <div id="categoryRank" class="ranking categories"></div>
    </section>
    <div class="key" id="typeLegend"></div>
  </aside>

  <div class="canvas-tools surface interface">
    <button id="zoomIn" title="Aproximar" aria-label="Aproximar">+</button>
    <button id="zoomOut" title="Afastar" aria-label="Afastar">−</button>
    <button id="fitButton" title="Enquadrar rede" aria-label="Enquadrar rede">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
    </button>
  </div>

  <aside id="detailPanel" class="detail-panel surface interface" aria-live="polite">
    <button id="closePanel" class="close-button" aria-label="Fechar detalhes">×</button>
    <div id="detailContent"></div>
  </aside>

  <section id="tableView" class="table-view surface interface" aria-label="Tabela das regionais">
    <div class="table-head">
      <div><small>TOPOLOGIA SENTINEL</small><h2>Regionais e conexões</h2></div>
      <button id="closeTable" class="close-button" aria-label="Fechar tabela">×</button>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Regional</th><th>UF</th><th>Conexões</th><th>Links</th><th>Firewalls</th><th>Switches</th><th>Servidores</th><th>VPNs</th><th>Antenas</th><th>Redes Wi-Fi</th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </section>

  <div id="toast" class="toast" role="status"></div>
  <script src="{{ url_for('static', filename='fluxo_neural_de_redes/app.js', v='20261014-10') }}"></script>
</body>
</html>
