{% extends "base.html" %}

{% block title %}Acesso não autorizado - Sentinel{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="text-center py-5">
        <i class="bi bi-shield-lock fs-1 text-danger"></i>
        <h1 class="h3 mt-3">Acesso não autorizado</h1>
        <p class="text-muted">{{ message or 'Você não possui permissão para acessar este conteúdo.' }}</p>
        <a href="{{ url_for('listar_regionais') }}" class="btn btn-primary">
            <i class="bi bi-arrow-left"></i> Voltar às regionais
        </a>
    </div>
</div>
{% endblock %}
